<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hensington Palace - Current Status</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .status-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .status-header h1 {
            margin: 0 0 0.5rem 0;
        }

        .status-header p {
            opacity: 0.8;
            margin: 0;
        }

        .rudy-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .hens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: stretch;
        }

        .chicken-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .chicken-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .chicken-card.rudy-card {
            max-width: 320px;
            padding: 1.25rem;
        }

        .chicken-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border-radius: 50%;
            overflow: hidden;
        }

        .rudy-card .chicken-avatar {
            width: 110px;
            height: 110px;
        }

        .chicken-avatar img {
            width: 115%;
            height: 115%;
            object-fit: cover;
            object-position: center;
        }

        .chicken-name {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 0 0 0.4rem 0;
        }

        .egg-color {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.7;
            margin: auto 0 0.75rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .egg-icon {
            width: 24px;
            height: 28px;
            object-fit: cover;
            border-radius: 4px;
            vertical-align: middle;
        }

        .status-item {
            display: flex;
            align-items: center;
            padding: 0.6rem;
            margin: 0.4rem 0;
            background: var(--bg);
            border-radius: 8px;
        }

        .status-icon {
            font-size: 1.3rem;
            margin-right: 0.6rem;
        }

        .status-text {
            flex: 1;
        }

        .status-label {
            font-size: 0.8rem;
            opacity: 0.7;
            margin: 0;
        }

        .status-value {
            font-size: 0.95rem;
            font-weight: 500;
            margin: 0;
        }

        .laid-today {
            color: #22c55e;
        }

        .not-yet {
            color: #f59e0b;
        }

        .health-warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 3px solid #f59e0b;
        }

        .rudy-status {
            text-align: center;
            font-size: 1.1rem;
            padding: 0.75rem;
            background: var(--bg);
            border-radius: 8px;
            margin: 0.4rem 0;
        }

        .rudy-emoji {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 0.4rem;
        }

        .nav-links {
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }

        .nav-links a {
            margin: 0 1rem;
            color: var(--text);
            text-decoration: none;
            opacity: 0.7;
        }

        .nav-links a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="status-container">
        <div class="status-header">
            <h1>🐔 Hensington Palace</h1>
            <p>Current Status</p>
        </div>

        <div id="rudy-container" class="rudy-container"></div>
        <div id="hens-grid" class="hens-grid">
            <p style="text-align: center; opacity: 0.7; grid-column: 1 / -1;">Loading chicken status...</p>
        </div>

        <div class="nav-links">
            <a href="/blog.html">📝 View Blog</a>
            <a href="/poetry.html">📜 Poetry</a>
            <a href="/admin.html">🔒 Dashboard</a>
        </div>
    </div>

    <script>
        // Map chicken names to their avatar images
        const chickenAvatars = {
            'Rudy': '/images/rudy.png',
            'Mamma Mia': '/images/mamma-mia.png',
            'Brown Betty': '/images/brown-betty.png',
            'Madame Pompadour': '/images/madame-pompadour.png'
        };

        // Get egg image path for a chicken
        function getEggImage(name) {
            const eggs = {
                'Mamma Mia': '/images/egg_mamma_mia.png',
                'Brown Betty': '/images/egg_brown_betty.png',
                'Madame Pompadour': '/images/egg_madame_pompadour.png'
            };
            return eggs[name] || null;
        }

        async function loadChickenStatus() {
            const rudyContainer = document.getElementById('rudy-container');
            const hensGrid = document.getElementById('hens-grid');

            try {
                const response = await fetch('/api/status');
                if (!response.ok) throw new Error('Failed to load status');

                const chickens = await response.json();

                // Separate Rudy from the hens
                const rudy = chickens.find(c => c.rudy_status);
                const hens = chickens.filter(c => !c.rudy_status);

                // Render Rudy's card
                if (rudy) {
                    const avatarImage = chickenAvatars[rudy.name] || '/images/default.png';
                    rudyContainer.innerHTML = `
                        <div class="chicken-card rudy-card">
                            <div class="chicken-avatar">
                                <img src="${avatarImage}" alt="${rudy.name}">
                            </div>
                            <h2 class="chicken-name">${rudy.name}</h2>
                            <p class="egg-color">The Gentleman of the Coop</p>
                            <div class="rudy-status">
                                <span class="rudy-emoji">${rudy.rudy_status.emoji}</span>
                                <strong>${rudy.rudy_status.text}</strong>
                            </div>
                        </div>
                    `;
                }

                // Render hens' cards
                hensGrid.innerHTML = hens.map(chicken => {
                    const avatarImage = chickenAvatars[chicken.name] || '/images/default.png';
                    const eggImage = getEggImage(chicken.name);
                    const laidToday = chicken.laid_today;
                    const lastEggDate = chicken.last_egg_date ? formatDate(chicken.last_egg_date) : 'Never';

                    // Build egg display HTML
                    const eggIcon = eggImage
                        ? `<img src="${eggImage}" alt="${chicken.egg_color} egg" class="egg-icon">`
                        : '🥚';

                    return `
                        <div class="chicken-card">
                            <div class="chicken-avatar">
                                <img src="${avatarImage}" alt="${chicken.name}">
                            </div>
                            <h2 class="chicken-name">${chicken.name}</h2>
                            <p class="egg-color">
                                ${eggIcon}
                                ${chicken.egg_color} eggs
                            </p>

                            <div class="status-item ${laidToday ? 'laid-today' : 'not-yet'}">
                                <div class="status-icon">${laidToday ? eggIcon : '⏱️'}</div>
                                <div class="status-text">
                                    <p class="status-label">Today</p>
                                    <p class="status-value">${laidToday ? 'Egg laid!' : 'Not yet'}</p>
                                </div>
                            </div>

                            <div class="status-item">
                                <div class="status-icon">📅</div>
                                <div class="status-text">
                                    <p class="status-label">Last egg</p>
                                    <p class="status-value">${lastEggDate}</p>
                                </div>
                            </div>

                            ${chicken.health_concern ? `
                                <div class="status-item health-warning">
                                    <div class="status-icon">⚠️</div>
                                    <div class="status-text">
                                        <p class="status-label">${chicken.health_concern.observation_type}</p>
                                        <p class="status-value">${chicken.health_concern.description}</p>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            } catch (error) {
                hensGrid.innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">Failed to load status. Please try again.</p>';
            }
        }

        function formatDate(dateString) {
            const [year, month, day] = dateString.split('-');
            const date = new Date(year, month - 1, day);

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const diffDays = Math.floor((today - date) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;

            return date.toLocaleDateString();
        }

        // Load status on page load
        loadChickenStatus();

        // Refresh every 60 seconds
        setInterval(loadChickenStatus, 60000);
    </script>
</body>
</html>
