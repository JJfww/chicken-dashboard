<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hensington Palace - Current Status</title>
    <link rel="stylesheet" href="style.css?v=3">
    <style>
        .status-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .status-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .status-header h1 {
            margin: 0 0 0.5rem 0;
        }

        .status-header p {
            opacity: 0.8;
            margin: 0;
        }

        .status-section {
            margin-bottom: 2rem;
        }

        .section-heading {
            margin: 0 0 0.35rem;
            text-align: center;
        }

        .section-subheading {
            margin: 0 0 1rem;
            text-align: center;
            opacity: 0.8;
        }

        .former-flock-grid {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .feature-flock-row {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .feature-flock-row .chicken-card {
            width: min(100%, 340px);
        }

        .group-card.rudy-card,
        .feature-flock-row .rudy-card {
            max-width: none;
        }

        .hens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: stretch;
        }

        .chicken-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .chicken-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .role-badge {
            display: inline-flex;
            align-self: center;
            margin-bottom: 0.65rem;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            background: rgba(245, 158, 11, 0.16);
            color: #f59e0b;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .feature-flock-row .role-badge {
            align-self: center;
            margin-left: auto;
            margin-right: auto;
        }

        .chicken-card.rudy-card {
            max-width: 320px;
            padding: 1.25rem;
        }

        .chicken-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border-radius: 50%;
            overflow: hidden;
        }

        .rudy-card .chicken-avatar {
            width: 110px;
            height: 110px;
        }

        .chicken-avatar img {
            width: 115%;
            height: 115%;
            object-fit: cover;
            object-position: center;
        }

        .chicken-name {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 0 0 0.4rem 0;
        }

        .egg-color {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.7;
            margin: auto 0 0.75rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .egg-icon {
            width: 24px;
            height: 28px;
            object-fit: cover;
            border-radius: 4px;
            vertical-align: middle;
        }

        .status-item {
            display: flex;
            align-items: center;
            padding: 0.6rem;
            margin: 0.4rem 0;
            background: var(--bg);
            border-radius: 8px;
        }

        .status-icon {
            font-size: 1.3rem;
            margin-right: 0.6rem;
        }

        .status-text {
            flex: 1;
        }

        .status-label {
            font-size: 0.8rem;
            opacity: 0.7;
            margin: 0;
        }

        .status-value {
            font-size: 0.95rem;
            font-weight: 500;
            margin: 0;
        }

        .laid-today {
            color: #22c55e;
        }

        .not-yet {
            color: #f59e0b;
        }

        .health-warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 3px solid #f59e0b;
        }

        .rudy-status {
            text-align: center;
            font-size: 1.1rem;
            padding: 0.75rem;
            background: var(--bg);
            border-radius: 8px;
            margin: 0.4rem 0;
        }

        .rudy-meter-summary {
            margin-top: 0.75rem;
            padding: 0.85rem;
            border-radius: 10px;
            background: rgba(169, 74, 74, 0.12);
            text-align: left;
        }

        .rudy-meter-summary p {
            margin: 0;
        }

        .rudy-meter-score {
            font-size: 1rem;
            font-weight: 700;
        }

        .rudy-meter-inline {
            display: block;
            margin-top: 0.35rem;
            font-size: 0.82rem;
            font-weight: 500;
            opacity: 0.72;
        }

        .rudy-meter-notes {
            margin-top: 0.4rem !important;
            opacity: 0.82;
            font-size: 0.92rem;
        }

        .former-flock-caption {
            margin: 0;
            text-align: center;
            opacity: 0.82;
            line-height: 1.5;
        }

        .chick-hatch-dates {
            text-align: center;
            opacity: 0.8;
            font-size: 0.9rem;
            margin: 0 0 0.75rem;
        }

        .lineage-note {
            margin: 0.75rem 0 0;
            text-align: center;
            opacity: 0.8;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .group-card .status-item {
            justify-content: center;
            text-align: center;
        }

        .group-card .status-icon {
            margin-right: 0.85rem;
        }

        .group-card .status-text {
            flex: 0 1 auto;
        }

        .group-card .status-label,
        .group-card .status-value,
        .feature-flock-row .egg-color,
        .group-card .former-flock-caption {
            text-align: center;
        }

        .chick-group-card .status-item {
            justify-content: flex-start;
            text-align: left;
        }

        .chick-group-card .status-text {
            flex: 1 1 auto;
        }

        .chick-group-card .status-label,
        .chick-group-card .status-value {
            text-align: left;
        }

        .rudy-emoji {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 0.4rem;
        }

        .nav-links {
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }

        .nav-links a {
            margin: 0 1rem;
            color: var(--text);
            text-decoration: none;
            opacity: 0.7;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .feature-flock-row .chicken-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="status-container">
        <div class="status-header">
            <h1>🐔 Hensington Palace</h1>
            <p>Current Status</p>
        </div>

        <section class="status-section">
            <h2 class="section-heading">Current Flock</h2>
            <p class="section-subheading">Madame Pompadour appears to be running the coop at the moment.</p>
            <div id="boss-hen-row" class="feature-flock-row">
                <p style="text-align: center; opacity: 0.7;">Loading chicken status...</p>
            </div>
            <div id="active-flock-grid" class="hens-grid">
            </div>
            <div id="chicks-row" class="feature-flock-row">
            </div>
        </section>
        <section class="status-section">
            <h2 class="section-heading">Rudy</h2>
            <p class="section-subheading">Rooster, father of the current chicks, and former flock member.</p>
            <div id="former-flock-grid" class="former-flock-grid"></div>
        </section>

        <div class="nav-links">
            <a href="/blog.html">📝 View Blog</a>
            <a href="/poetry.html">📜 Poetry</a>
            <a href="https://www.instagram.com/thecluckingtimes" target="_blank">IG</a>
            <a href="/admin.html">🔒 Dashboard</a>
        </div>
    </div>

    <script>
        const chickenAvatars = {
            'Mamma Mia': '/images/mamma-mia.png',
            'Brown Betty': '/images/brown-betty.png',
            'Madame Pompadour': '/images/MadamePompadour26.png',
            'Velma': '/images/Velma.png',
            'The Chicks': '/images/3Chicks.png',
            'Rudy': '/images/rudy.png'
        };

        function getEggImage(name) {
            const eggs = {
                'Mamma Mia': '/images/egg_mamma_mia.png',
                'Brown Betty': '/images/egg_brown_betty.png',
                'Madame Pompadour': '/images/egg_madame_pompadour.png'
            };
            return eggs[name] || null;
        }

        function formatShortDate(dateString) {
            return new Date(`${dateString}T12:00:00`).toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function renderFlockCard(chicken) {
            const avatarImage = chickenAvatars[chicken.name] || '/images/default.png';
            const eggImage = getEggImage(chicken.name);
            const laidToday = chicken.laid_today;
            const lastEggDate = chicken.last_egg_date ? formatDate(chicken.last_egg_date) : 'Not yet';
            const isRooster = chicken.is_rooster || chicken.name === 'Velma' || chicken.display_name === 'Velma/Vinnie';
            const displayName = chicken.display_name || (chicken.name === 'Velma' ? 'Velma/Vinnie' : chicken.name);
            const subtitle = isRooster
                ? 'Young rooster, no eggs'
                : `${eggImage ? `<img src="${eggImage}" alt="${chicken.egg_color} egg" class="egg-icon">` : '🥚'} ${chicken.egg_color} eggs`;

            return `
                <div class="chicken-card">
                    <div class="chicken-avatar">
                        <img src="${avatarImage}" alt="${chicken.name}">
                    </div>
                    <h2 class="chicken-name">${displayName}</h2>
                    ${chicken.role_label ? `<span class="role-badge">${chicken.role_label}</span>` : ''}
                    <p class="egg-color">${subtitle}</p>

                    <div class="status-item ${laidToday ? 'laid-today' : 'not-yet'}">
                        <div class="status-icon">${isRooster ? '🚫🥚' : laidToday ? (eggImage ? `<img src="${eggImage}" alt="${chicken.egg_color} egg" class="egg-icon">` : '🥚') : '⏱️'}</div>
                        <div class="status-text">
                            <p class="status-label">Today</p>
                            <p class="status-value">${isRooster ? 'No eggs. Started crowing.' : (laidToday ? 'Egg laid!' : 'Not yet')}</p>
                        </div>
                    </div>

                    <div class="status-item">
                        <div class="status-icon">${isRooster ? '❌📆' : '📆'}</div>
                        <div class="status-text">
                            <p class="status-label">${isRooster ? 'Status' : 'Last egg'}</p>
                            <p class="status-value">${isRooster ? 'Competing for king of the coop' : lastEggDate}</p>
                        </div>
                    </div>

                    ${chicken.health_concern ? `
                        <div class="status-item health-warning">
                            <div class="status-icon">⚠️</div>
                            <div class="status-text">
                                <p class="status-label">${chicken.health_concern.observation_type}</p>
                                <p class="status-value">${chicken.health_concern.description}</p>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderChickGroupCard(chickGroup) {
            const avatarImage = chickenAvatars[chickGroup.name] || '/images/default.png';
            const milestone = chickGroup.milestone;

            return `
                <div class="chicken-card group-card chick-group-card">
                    <div class="chicken-avatar">
                        <img src="${avatarImage}" alt="${chickGroup.name}">
                    </div>
                    <h2 class="chicken-name">${chickGroup.name}</h2>
                    <p class="chick-hatch-dates">${chickGroup.hatch_summary}</p>
                    <div class="status-item">
                        <div class="status-icon">🐥</div>
                        <div class="status-text">
                            <p class="status-label">Milestone</p>
                            <p class="status-value">${milestone ? milestone.label : 'No milestone logged yet'}</p>
                        </div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon">🪺</div>
                        <div class="status-text">
                            <p class="status-label">Today</p>
                            <p class="status-value">${milestone ? milestone.description : chickGroup.summary}</p>
                        </div>
                    </div>
                    ${chickGroup.lineage_note ? `
                        <p class="lineage-note">${chickGroup.lineage_note}</p>
                    ` : ''}
                    ${milestone?.notes ? `
                        <div class="status-item">
                            <div class="status-icon">📝</div>
                            <div class="status-text">
                                <p class="status-label">Notes</p>
                                <p class="status-value">${milestone.notes}</p>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderFormerFlockCard(chicken) {
            const avatarImage = chickenAvatars[chicken.name] || '/images/default.png';

            return `
                <div class="chicken-card rudy-card group-card">
                    <div class="chicken-avatar">
                        <img src="${avatarImage}" alt="${chicken.name}">
                    </div>
                    <h2 class="chicken-name">${chicken.name}</h2>
                    <p class="egg-color">Rooster and chick dad</p>
                    <p class="former-flock-caption">${chicken.caption}</p>
                </div>
            `;
        }

        async function loadChickenStatus() {
            const bossHenRow = document.getElementById('boss-hen-row');
            const activeFlockGrid = document.getElementById('active-flock-grid');
            const chicksRow = document.getElementById('chicks-row');
            const formerFlockGrid = document.getElementById('former-flock-grid');

            try {
                const response = await fetch('/api/status');
                if (!response.ok) throw new Error('Failed to load status');

                const data = await response.json();
                const bossHen = data.activeFlock.find(chicken => chicken.name === 'Madame Pompadour');
                const trioOrder = ['Brown Betty', 'Mamma Mia', 'Velma'];
                const remainingFlock = trioOrder
                    .map(name => data.activeFlock.find(chicken => chicken.name === name))
                    .filter(Boolean);

                bossHenRow.innerHTML = bossHen ? renderFlockCard(bossHen) : '';
                activeFlockGrid.innerHTML = remainingFlock.map(renderFlockCard).join('');
                chicksRow.innerHTML = renderChickGroupCard(data.chickGroup);
                formerFlockGrid.innerHTML = data.formerFlock.map(renderFormerFlockCard).join('');
            } catch (error) {
                bossHenRow.innerHTML = '<p style="text-align: center; color: red;">Failed to load status. Please try again.</p>';
                activeFlockGrid.innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">Failed to load status. Please try again.</p>';
                chicksRow.innerHTML = '';
                formerFlockGrid.innerHTML = '';
            }
        }

        function formatDate(dateString) {
            const [year, month, day] = dateString.split('-');
            const date = new Date(year, month - 1, day);

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const diffDays = Math.floor((today - date) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;

            return date.toLocaleDateString();
        }

        // Load status on page load
        loadChickenStatus();

        // Refresh every 60 seconds
        setInterval(loadChickenStatus, 60000);
    </script>
</body>
</html>
