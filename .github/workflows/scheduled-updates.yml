name: Scheduled Updates

on:
  # The schedule moved to the chicken-scheduler Cloudflare Worker (scheduler/), because GitHub
  # started scheduled runs 6-8 hours late. This workflow stays for posting a missed edition by hand.
  workflow_dispatch:
    inputs:
      date:
        description: 'Post the edition for this date (YYYY-MM-DD, a Sunday or Wednesday)'
        required: true

jobs:
  blog-edition:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the blog edition
        run: |
          body_file=$(mktemp)
          http_status=$(curl -sS -o "$body_file" -w "%{http_code}" -X POST \
            "https://chicken-dashboard.pages.dev/api/blog/scheduled?date=${{ github.event.inputs.date }}" \
            -H "Authorization: Bearer ${{ secrets.WEATHER_LOG_TOKEN }}")
          echo "HTTP $http_status: $(cat "$body_file")"
          if [ "$http_status" -ge 400 ]; then
            echo "::error::Blog edition failed with HTTP $http_status"
            exit 1
          fi
