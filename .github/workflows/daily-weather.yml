name: Daily Weather Log

on:
  schedule:
    # Logs the previous (complete) day each morning. GitHub often delays scheduled
    # runs by hours; a late-night run used to slip past midnight and check the new,
    # still-empty day, so nearly every day since March was skipped as "no_activity".
    # 12:00 UTC = 6 AM CST / 7 AM CDT.
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  log-weather:
    runs-on: ubuntu-latest
    env:
      WEATHER_LOG_URL: https://chicken-dashboard.pages.dev/api/weather-log
    steps:
      - name: Log daily weather
        run: |
          log_date=$(TZ=America/Chicago date -d 'yesterday' +%F)
          body_file=$(mktemp)
          http_status=$(curl -sS -o "$body_file" -w "%{http_code}" -X POST \
            "$WEATHER_LOG_URL?date=$log_date" \
            -H "Authorization: Bearer ${{ secrets.WEATHER_LOG_TOKEN }}")

          body=$(cat "$body_file")

          echo "HTTP $http_status: $body"

          if [ "$http_status" -ge 400 ]; then
            echo "::error::Weather log failed with HTTP $http_status"
            exit 1
          fi
