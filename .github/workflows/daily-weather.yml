name: Daily Weather Log

on:
  schedule:
    # 11:55 PM CST = 5:55 AM UTC
    - cron: '55 5 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  log-weather:
    runs-on: ubuntu-latest
    env:
      WEATHER_LOG_URL: https://chicken-dashboard.pages.dev/api/weather-log
    steps:
      - name: Log daily weather
        run: |
          body_file=$(mktemp)
          http_status=$(curl -sS -o "$body_file" -w "%{http_code}" -X POST \
            "$WEATHER_LOG_URL" \
            -H "Authorization: Bearer ${{ secrets.WEATHER_LOG_TOKEN }}")

          body=$(cat "$body_file")

          echo "HTTP $http_status: $body"

          if [ "$http_status" -ge 400 ]; then
            echo "::error::Weather log failed with HTTP $http_status"
            exit 1
          fi
